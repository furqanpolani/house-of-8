
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ash Wood Chair — Product Gallery</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500;600&display=swap');

  :root{
    --ink:#27282a;
    --muted:#67686a;
    --line:#e9e8e5;
    --paper:#fafaf9;
    --panel:#f3f3f1;
    --accent:#b77d4d;
  }

  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;background:var(--paper);color:var(--ink)}
  body{font-family:"DM Sans",Arial,sans-serif;overflow:hidden}

  .page{
    width:100vw;
    height:100vh;
    min-height:620px;
    display:flex;
    flex-direction:column;
  }

  /* Header */
  header{
    height:58px;
    flex:0 0 58px;
    border-bottom:1px solid var(--line);
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    padding:0 27px;
    background:#fff;
    position:relative;
    z-index:10;
  }

  .menu{
    width:20px;height:16px;display:flex;flex-direction:column;justify-content:center;gap:4px;
    cursor:pointer;
  }
  .menu span{display:block;height:1px;background:#4c4d4d;width:13px}
  .menu span:nth-child(2){width:8px}

  .brand{
    font-family:"Cormorant Garamond",Georgia,serif;
    font-size:19px;
    letter-spacing:.02em;
    color:#8d8b84;
    line-height:1;
    text-align:center;
  }
  .brand small{
    display:block;
    font-family:"DM Sans",Arial,sans-serif;
    font-size:6px;
    letter-spacing:.08em;
    text-transform:uppercase;
    margin-top:-1px;
    color:#aaa79f;
  }

  .basket-link{
    justify-self:end;
    font-size:9px;
    color:#73736f;
    display:flex;align-items:center;gap:7px;
  }
  .basket-dot{width:4px;height:4px;border-radius:50%;background:#b9b8b0}

  /* Main composition */
  main{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:minmax(0, 53.3%) minmax(390px, 31.8%) minmax(150px, 14.9%);
    gap:0;
    overflow:hidden;
  }

  .gallery{
    position:relative;
    background:#f5f5f3;
    overflow:hidden;
    border-right:1px solid #efeeeb;
  }

  .slides{
    position:absolute;
    inset:0;
    display:flex;
    transition:transform .65s cubic-bezier(.22,.61,.36,1);
  }

  .slide{
    min-width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:70px 60px 74px;
  }

  .slide img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    filter:saturate(.92);
    user-select:none;
    pointer-events:none;
  }

  .gallery-controls{
    position:absolute;
    right:22px;
    bottom:22px;
    display:flex;
    gap:17px;
    z-index:3;
  }

  .arrow{
    border:0;
    width:48px;height:48px;
    border-radius:50%;
    background:#777776;
    color:white;
    display:grid;
    place-items:center;
    cursor:pointer;
    font-size:27px;
    font-weight:300;
    line-height:1;
    transition:transform .2s,background .2s;
  }
  .arrow:hover{transform:scale(1.04);background:#5f5f5e}
  .arrow:active{transform:scale(.96)}
  .arrow.left{padding-right:2px}
  .arrow.right{padding-left:2px}

  /* Product details */
  .details{
    background:#fff;
    padding:43px 72px 32px 88px;
    position:relative;
    overflow:auto;
  }

  .eyebrow{
    font-size:10px;
    letter-spacing:.03em;
    color:#747573;
    margin:0 0 3px;
    text-transform:uppercase;
  }

  h1{
    font-family:"Cormorant Garamond",Georgia,serif;
    font-weight:500;
    font-size:27px;
    letter-spacing:-.025em;
    line-height:1;
    margin:0 0 10px;
    text-transform:uppercase;
  }

  .price{
    font-family:"Cormorant Garamond",Georgia,serif;
    font-size:24px;
    line-height:1;
    margin-bottom:28px;
  }

  .ref{
    font-size:10px;
    color:#656662;
    margin-bottom:22px;
  }

  .swatches{
    display:flex;
    gap:20px;
    margin-bottom:23px;
  }
  .swatch{
    width:48px;height:48px;border-radius:50%;
    border:1px solid rgba(0,0,0,.06);
    cursor:pointer;
    position:relative;
  }
  .swatch.selected:after{
    content:"";
    position:absolute;
    inset:-5px;
    border:1px solid #6c6d6b;
    border-radius:50%;
  }
  .swatch.one{background:#c9c5bb}
  .swatch.two{background:#b67a49}

  .description{
    max-width:360px;
    font-size:14px;
    line-height:1.5;
    color:#4d4e4d;
    margin:0 0 42px;
  }

  .qty-row{
    display:flex;
    align-items:center;
    gap:26px;
    margin-bottom:25px;
  }
  .qty-label{
    font-size:13px;
    color:#5f605e;
    letter-spacing:.01em;
  }
  .qty{
    height:61px;
    width:181px;
    border:1px solid #bdbdb9;
    border-radius:10px;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    align-items:center;
    text-align:center;
    font-size:19px;
  }
  .qty button{
    border:0;background:none;color:#27282a;
    font-size:22px;cursor:pointer;height:100%;
  }
  .qty-value{font-size:13px}

  .order{
    width:100%;
    height:53px;
    border:0;
    border-radius:15px;
    background:#292b2e;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    font-family:inherit;
    font-size:13px;
    cursor:pointer;
    margin-bottom:12px;
  }
  .order span:last-child{font-size:12px}

  .delivery{
    font-size:11px;
    color:#50514f;
    margin:0 0 24px;
  }

  .basket{
    width:100%;
    height:59px;
    border:1px solid #252729;
    border-radius:15px;
    display:grid;
    grid-template-columns:1fr 1.2fr;
    overflow:hidden;
    background:#fff;
  }
  .basket button{
    border:0;background:#fff;font-family:inherit;font-size:12px;color:#313230;cursor:pointer
  }
  .basket button:last-child{
    background:#292b2e;color:#fff;
  }

  /* Peek panel on the right */
  .peek{
    background:#f1f1ef;
    overflow:hidden;
    position:relative;
  }
  .peek-track{
    height:100%;
    display:flex;
    transition:transform .65s cubic-bezier(.22,.61,.36,1);
  }
  .peek-slide{
    min-width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:flex-start;
  }
  .peek-slide img{
    height:100%;
    width:180%;
    max-width:none;
    object-fit:contain;
    object-position:left center;
    transform:translateX(-8%);
    filter:saturate(.92);
  }

  /* Decorative branch, matching the reference composition */
  .branch{
    position:absolute;
    right:-2px;
    top:0;
    width:115px;
    height:250px;
    pointer-events:none;
    opacity:.75;
  }
  .branch svg{width:100%;height:100%}

  @media (max-width:1100px){
    .details{padding-left:48px;padding-right:42px}
    main{grid-template-columns:54% 38% 8%}
    .peek{display:block}
  }

  @media (max-width:800px){
    body{overflow:auto}
    .page{height:auto;min-height:100vh}
    main{display:block;overflow:visible}
    .gallery{height:58vh;min-height:430px}
    .details{padding:34px 28px 42px;overflow:visible}
    .peek{display:none}
    header{grid-template-columns:1fr auto 1fr}
    .description{max-width:none}
    .order,.basket{max-width:520px}
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="menu" aria-label="Menu"><span></span><span></span><span></span></div>
    <div class="brand">House of Craft<small>Furniture & objects</small></div>
    <div class="basket-link"><span class="basket-dot"></span>Your Basket</div>
  </header>

  <main>
    <section class="gallery" aria-label="Product gallery">
      <!--
        Product gallery is generated from productImages in the script below.

        2 images:
          Image 1 -> LEFT | Image 2 -> RIGHT
          Image 2 -> LEFT | Image 1 -> RIGHT

        3 images:
          Image 1 -> LEFT | Image 2 -> RIGHT
          Image 2 -> LEFT | Image 3 -> RIGHT
          Image 3 -> LEFT | Image 1 -> RIGHT

        Add more image filenames to productImages and the carousel remains circular.
      -->
      <div class="slides" id="slides"></div>

      <div class="branch">
        <svg viewBox="0 0 115 250" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M115 0C92 35 98 67 106 92C113 113 109 144 85 170C65 191 53 214 54 250" stroke="#343434" stroke-width="1.1"/>
          <path d="M99 45C79 36 67 26 59 10" stroke="#343434" stroke-width="1"/>
          <path d="M105 77C87 73 71 64 57 51" stroke="#343434" stroke-width="1"/>
          <path d="M107 103C90 98 75 91 62 81" stroke="#343434" stroke-width="1"/>
          <path d="M97 142C78 139 63 132 50 122" stroke="#343434" stroke-width="1"/>
        </svg>
      </div>

      <div class="gallery-controls">
        <button class="arrow left" id="prev" aria-label="Previous product image">‹</button>
        <button class="arrow right" id="next" aria-label="Next product image">›</button>
      </div>
    </section>

    <aside class="details">
      <p class="eyebrow">New collection</p>
      <h1>Ash Wood Chair</h1>
      <div class="price">PKR 45,000</div>

      <div class="ref">REF. 2372/073</div>

      <div class="swatches" aria-label="Color options">
        <button class="swatch one selected" aria-label="Natural ash"></button>
        <button class="swatch two" aria-label="Warm oak"></button>
      </div>

      <p class="description">
        Chair with an ash structure and a plaited seagrass base and back.
      </p>

      <div class="qty-row">
        <div class="qty-label">QTY.</div>
        <div class="qty">
          <button id="minus" aria-label="Decrease quantity">−</button>
          <div class="qty-value" id="qty">02</div>
          <button id="plus" aria-label="Increase quantity">+</button>
        </div>
      </div>

      <button class="order">
        <span>Order Now</span>
        <span>PKR 45,000</span>
      </button>

      <p class="delivery">PKR 600 delivery charges may apply</p>

      <div class="basket">
        <button>PKR 45,000</button>
        <button>Add to Basket</button>
      </div>
    </aside>

    <section class="peek" aria-hidden="true">
      <div class="peek-track" id="peekTrack"></div>
    </section>
  </main>
</div>

<script>
  /*
    ============================================================
    PRODUCT IMAGES
    ============================================================

    Add every image for this product here, in display order.

    2 images:
      Image 1 -> LEFT | Image 2 -> RIGHT
      Image 2 -> LEFT | Image 1 -> RIGHT

    3 images:
      Image 1 -> LEFT | Image 2 -> RIGHT
      Image 2 -> LEFT | Image 3 -> RIGHT
      Image 3 -> LEFT | Image 1 -> RIGHT

    4 images:
      Image 1 -> LEFT | Image 2 -> RIGHT
      Image 2 -> LEFT | Image 3 -> RIGHT
      Image 3 -> LEFT | Image 4 -> RIGHT
      Image 4 -> LEFT | Image 1 -> RIGHT

    The last image always loops back to image 1.
  */
  const productImages = [
    'product-image-1.png',
    'product-image-2.png'

    // Add more images here:
    // 'product-image-3.png',
    // 'product-image-4.png',
  ];

  const slides = document.getElementById('slides');
  const peek = document.getElementById('peekTrack');

  let index = 0;
  let isAnimating = false;

  function createGallery() {
    slides.innerHTML = '';
    peek.innerHTML = '';

    productImages.forEach((image, i) => {
      // Main / left image
      const slide = document.createElement('div');
      slide.className = 'slide';

      const img = document.createElement('img');
      img.src = image;
      img.alt = `Product image ${i + 1}`;
      slide.appendChild(img);
      slides.appendChild(slide);

      // Right image is the NEXT image.
      // % makes the carousel circular.
      const nextIndex = (i + 1) % productImages.length;

      const peekSlide = document.createElement('div');
      peekSlide.className = 'peek-slide';

      const peekImg = document.createElement('img');
      peekImg.src = productImages[nextIndex];
      peekImg.alt = '';
      peekSlide.appendChild(peekImg);
      peek.appendChild(peekSlide);
    });

    updateGallery(false);
  }

  function updateGallery(animate = true) {
    slides.style.transition = animate
      ? 'transform .65s cubic-bezier(.22,.61,.36,1)'
      : 'none';

    peek.style.transition = animate
      ? 'transform .65s cubic-bezier(.22,.61,.36,1)'
      : 'none';

    slides.style.transform = `translateX(-${index * 100}%)`;
    peek.style.transform = `translateX(-${index * 100}%)`;
  }

  function goNext() {
    if (isAnimating || productImages.length < 2) return;

    isAnimating = true;
    index = (index + 1) % productImages.length;
    updateGallery(true);

    setTimeout(() => {
      isAnimating = false;
    }, 680);
  }

  function goPrevious() {
    if (isAnimating || productImages.length < 2) return;

    isAnimating = true;
    index = (index - 1 + productImages.length) % productImages.length;
    updateGallery(true);

    setTimeout(() => {
      isAnimating = false;
    }, 680);
  }

  document.getElementById('prev').addEventListener('click', goPrevious);
  document.getElementById('next').addEventListener('click', goNext);

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') goPrevious();
    if (e.key === 'ArrowRight') goNext();
  });

  // Quantity
  let quantity = 2;
  const qty = document.getElementById('qty');

  function renderQty() {
    qty.textContent = String(quantity).padStart(2, '0');
  }

  document.getElementById('minus').addEventListener('click', () => {
    quantity = Math.max(1, quantity - 1);
    renderQty();
  });

  document.getElementById('plus').addEventListener('click', () => {
    quantity += 1;
    renderQty();
  });

  // Color swatches
  document.querySelectorAll('.swatch').forEach(swatch => {
    swatch.addEventListener('click', () => {
      document.querySelectorAll('.swatch')
        .forEach(s => s.classList.remove('selected'));

      swatch.classList.add('selected');
    });
  });

  createGallery();
</script>
</body>
</html>
