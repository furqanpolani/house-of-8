<!DOCTYPE html>
  <html lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>House of 8 — Your Basket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  </head>
  <body>

  <!-- ===================== HEADER ===================== -->
  <header class="header">
  <button class="hamburger" aria-label="Open menu">
  <span></span>
  <span></span>
  <span></span>
  </button>

  <a href="index.html" class="logo">
  <img src="assets/logo.svg" alt="House of 8" class="logo-svg">
  </a>

  <a href="cart.html" class="basket-link">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
  <line x1="3" y1="6" x2="21" y2="6"/>
  <path d="M16 10a4 4 0 01-8 0"/>
  </svg>
  Your Basket
</a>
  </header>

  <!-- ===================== BASKET / CHECKOUT ===================== -->
  <section class="cart-section">
  <div class="cart-section-inner">

  <div>
  <h1 class="cart-heading">Your Basket</h1>
  <div class="cart-items" id="cartItems">

  <article class="cart-item" data-price="65000" data-qty="1">
  <div class="cart-item-img">
  <img src="assets/4/Arm chair + Puffy.png" alt="Boucle Armchair and Ottoman">
  </div>
  <div class="cart-item-body">
  <h4 class="cart-item-name">Boucle Armchair &amp; Ottoman</h4>
  <p class="cart-item-ref">REF. 3391/041</p>
  <p class="cart-item-price item-unit-price">PKR 65,000</p>
  <div class="cart-item-footer">
  <div class="qty-control">
  <button class="qty-minus" aria-label="Decrease quantity">&minus;</button>
  <span class="qty-display">1</span>
  <button class="qty-plus" aria-label="Increase quantity">+</button>
  </div>
  <a href="#" class="cart-item-remove">Remove</a>
  </div>
  </div>
  </article>

  <article class="cart-item" data-price="52000" data-qty="1">
  <div class="cart-item-img">
  <img src="assets/4/IMG_9159-Edit copy.png" alt="Noir Bar Cabinet">
  </div>
  <div class="cart-item-body">
  <h4 class="cart-item-name">Noir Bar Cabinet</h4>
<p class="cart-item-ref">REF. 3391/042</p>
<p class="cart-item-price item-unit-price">PKR 52,000</p>
<div class="cart-item-footer">
<div class="qty-control">
<button class="qty-minus" aria-label="Decrease quantity">&minus;</button>
<span class="qty-display">1</span>
  <button class="qty-plus" aria-label="Increase quantity">+</button>
  </div>
  <a href="#" class="cart-item-remove">Remove</a>
  </div>
  </div>
  </article>

  </div>
  </div>

  <aside class="checkout-panel">
  <h2 class="checkout-title">Checkout</h2>

  <div class="checkout-row">
  <span>Total Items</span>
  <span id="totalItems">2</span>
  </div>
  <div class="checkout-row">
  <span>Subtotal</span>
  <span id="subtotal">PKR 117,000</span>
  </div>
  <div class="checkout-row">
  <span>Tax (16%)</span>
  <span id="tax">PKR 18,720</span>
  </div>
  <div class="checkout-row">
  <span>Delivery Charges</span>
  <span id="delivery">PKR 1,500</span>
  </div>
  <div class="checkout-row checkout-row--total">
  <span>Total</span>
  <span id="total">PKR 137,220</span>
  </div>

  <button class="btn btn--black">Proceed to Payment &rarr;</button>
  </aside>

  </div>
  </section>

  <script>
  (function () {
  const DELIVERY = 1500;
const TAX_RATE = 0.16;

const cartItems = document.getElementById('cartItems');
const totalItemsEl = document.getElementById('totalItems');
const subtotalEl = document.getElementById('subtotal');
const taxEl = document.getElementById('tax');
const deliveryEl = document.getElementById('delivery');
const totalEl = document.getElementById('total');

function format(n) {
return 'PKR ' + n.toLocaleString('en-US');
}

function recalc() {
  const items = Array.from(cartItems.querySelectorAll('.cart-item'));
let totalItems = 0;
let subtotal = 0;

items.forEach(item => {
  const price = Number(item.getAttribute('data-price'));
  const qty = Number(item.getAttribute('data-qty'));
totalItems += qty;
subtotal += price * qty;
});

const tax = Math.round(subtotal * TAX_RATE);
const delivery = items.length ? DELIVERY : 0;
const total = subtotal + tax + delivery;

totalItemsEl.textContent = totalItems;
subtotalEl.textContent = format(subtotal);
taxEl.textContent = format(tax);
deliveryEl.textContent = format(delivery);
totalEl.textContent = format(total);
}

cartItems.addEventListener('click', (e) => {
  const item = e.target.closest('.cart-item');
if (!item) return;

if (e.target.classList.contains('qty-plus')) {
const qty = Number(item.getAttribute('data-qty')) + 1;
item.setAttribute('data-qty', qty);
item.querySelector('.qty-display').textContent = qty;
recalc();
}

if (e.target.classList.contains('qty-minus')) {
let qty = Number(item.getAttribute('data-qty'));
if (qty > 1) {
qty--;
item.setAttribute('data-qty', qty);
item.querySelector('.qty-display').textContent = qty;
recalc();
}
}

if (e.target.classList.contains('cart-item-remove')) {
e.preventDefault();
item.remove();
recalc();
}
});

recalc();
})();
</script>
  </body>
  </html>
